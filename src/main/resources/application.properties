spring.application.name=simple_storage_app

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:simple_storage_app}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File upload limit: 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# S3-compatible storage (AWS S3, MinIO, etc.)
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.region=${S3_REGION:ap-south-1}
app.s3.bucket=${S3_BUCKET:simple-storage-app}
app.s3.access-key=${AWS_ACCESS_KEY_ID:yyy}
app.s3.secret-key=${AWS_SECRET_ACCESS_KEY:xxx}
app.s3.path-style-access=${S3_PATH_STYLE:true}

# Optional: override in env or profile
# S3_ENDPOINT, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, etc.
