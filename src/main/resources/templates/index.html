<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Simple Storage</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        h1 { margin-bottom: 0.5rem; }
        .sub { color: #666; margin-bottom: 1.5rem; }
        .upload { background: #f5f5f5; padding: 1.25rem; border-radius: 8px; margin-bottom: 2rem; }
        .upload input[type="file"] { margin: 0.5rem 0; display: block; }
        .upload button { padding: 0.5rem 1rem; background: #333; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .upload button:hover { background: #555; }
        .msg { padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; }
        .msg.success { background: #e8f5e9; color: #2e7d32; }
        .msg.error { background: #ffebee; color: #c62828; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #eee; }
        th { color: #666; font-weight: 500; }
        .actions form { display: inline; }
        .actions button { padding: 0.35rem 0.75rem; font-size: 0.875rem; background: #c62828; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .actions button:hover { background: #b71c1c; }
        .empty { color: #888; padding: 1rem 0; }
    </style>
</head>
<body>
    <h1>Simple Storage</h1>
    <p class="sub">Upload files (max 5 MB). Stored in S3 and listed in the database.</p>

    <div th:if="${message}" class="msg success" th:text="${message}"></div>
    <div th:if="${error}" class="msg error" th:text="${error}"></div>

    <div class="upload">
        <form method="post" action="/upload" enctype="multipart/form-data">
            <label for="file">Choose a file (max 5 MB)</label>
            <input type="file" name="file" id="file" required/>
            <button type="submit">Upload</button>
        </form>
    </div>

    <h2>Stored files</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Size</th>
                <th>Uploaded</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="f : ${files}">
                <td th:text="${f.originalFilename}">name</td>
                <td th:text="${f.size >= 1048576 ? (#numbers.formatDecimal(f.size / 1048576.0, 1, 2) + ' MB') : (#numbers.formatDecimal(f.size / 1024.0, 1, 2) + ' KB')}">size</td>
                <td th:text="${#temporals.format(f.createdAt, 'yyyy-MM-dd HH:mm')}">date</td>
                <td class="actions">
                    <form method="post" th:action="@{/delete/{id}(id=${f.id})}" onsubmit="return confirm('Delete this file?');">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(files)}">
                <td colspan="4" class="empty">No files yet. Upload one above.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
